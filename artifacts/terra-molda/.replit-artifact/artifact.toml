kind = "web"
previewPath = "/"
title = "Terra Molda"
description = "Site institucional para a Terra Molda, marca de produtos biodegradáveis que une consciência ecológica, design natural e compromisso com um planeta mais limpo para as próximas gerações."
version = "1.0.0"
id = "artifacts/terra-molda"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18983

[services.development]
run = "pnpm --filter @workspace/terra-molda run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/terra-molda", "run", "build" ]
serve = "static"
publicDir = "artifacts/terra-molda/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18983"
BASE_PATH = "/"
